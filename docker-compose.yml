version: '3.9'

services:

  mlflow-server:
    image: python:3.13-slim
    container_name: mlflow-server

    working_dir: /app

    volumes:
      - .:/app
      - mlflow-data:/app/mlruns

    command: >
      sh -c "
      pip install mlflow &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      "

    ports:
      - "5000:5000"

    networks:
      - mlops-network

  api-service:
    build: .

    depends_on:
      - mlflow-server

    ports:
      - "8000"

    networks:
      - mlops-network

  prometheus:
    image: prom/prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    networks:
      - mlops-network

  grafana:
    image: grafana/grafana

    ports:
      - "3000:3000"

    networks:
      - mlops-network

  node-exporter:
    image: prom/node-exporter

    ports:
      - "9100:9100"

    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge

volumes:
  mlflow-data: